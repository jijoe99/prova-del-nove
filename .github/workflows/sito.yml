# Workflow del blog. Va usato quando la cartella blog/ è la RADICE del repo del blog
# (repo pubblico separato, vedi DEPLOY.md). Non pubblica nulla finché non lo attivi tu.
name: Sito

on:
  pull_request:           # ogni bozza arriva come pull request: qui si controlla solo che la build passi
  push:
    branches: [main]      # al merge su main il sito si aggiorna
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Per un sito di progetto (https://UTENTE.github.io/NOME-REPO/) servono questi due valori.
      # Con un dominio personale: SITE_URL = https://tuodominio.it e BASE_PATH = /
      SITE_URL: https://${{ github.repository_owner }}.github.io
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
