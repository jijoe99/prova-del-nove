# Il blog vive su Cloudflare Pages, che lo costruisce da solo a ogni merge su main (vedi DEPLOY.md).
# Questo workflow fa due cose:
# - sulle pull request controlla che la build passi;
# - su main pubblica su GitHub Pages solo pagine di reindirizzamento, cosi' i vecchi link
#   https://jijoe99.github.io/prova-del-nove/... portano alla stessa pagina sul nuovo indirizzo.
name: Sito

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NEW_SITE: https://prova-del-nove.provadelnove.workers.dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # stessa struttura di pagine del vecchio sito: serve a sapere quali indirizzi reindirizzare
      - run: npm run build
        env:
          SITE_URL: ${{ env.NEW_SITE }}
          BASE_PATH: /
      - name: Pagine di reindirizzamento verso il nuovo indirizzo
        if: github.event_name != 'pull_request'
        run: |
          mkdir redirect
          cd dist
          find . -name '*.html' | while read -r f; do
            p="${f#./}"; p="${p%index.html}"
            [ "$p" = "404.html" ] && p=""
            mkdir -p "../redirect/$(dirname "$f")"
            printf '<!doctype html><meta charset="utf-8"><title>Il blog si e'"'"' spostato</title><link rel="canonical" href="%s/%s"><meta http-equiv="refresh" content="0; url=%s/%s"><p>Il blog si e'"'"' spostato: <a href="%s/%s">%s/%s</a></p>\n' \
              "$NEW_SITE" "$p" "$NEW_SITE" "$p" "$NEW_SITE" "$p" "$NEW_SITE" "$p" > "../redirect/$f"
          done
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: redirect

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
